# Include inside the HTTPS server block serving the Staff frontend.
# A separate public portal gateway must overwrite this header with public.
location /api/ {
    # No URI suffix: preserve the complete /api/... request path.
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Guardian-Portal staff;
    proxy_cache off;
}
