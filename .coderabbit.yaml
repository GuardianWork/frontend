# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration for the GuardianWork frontend.
# Reference: https://docs.coderabbit.ai/reference/configuration

language: "en-US"
early_access: false

tone_instructions: >-
  Be concise and direct. State the concrete risk in each finding and suggest a
  specific fix. Skip praise and avoid restating the diff.

reviews:
  # "chill" is CodeRabbit's balanced profile: real bugs, security, and
  # maintainability issues without nitpicky style comments.
  profile: "chill"

  high_level_summary: true
  high_level_summary_in_walkthrough: true
  auto_title_placeholder: "@coderabbitai"
  review_status: false
  review_details: false

  changed_files_summary: true
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  poem: false

  # Skip generated code, build artifacts, lockfiles, local tooling.
  # Application source and docs stay reviewed.
  path_filters:
  - "!src/routeTree.gen.ts"
  - "!**/*.tsbuildinfo"
  - "!**/node_modules/**"
  - "!**/dist/**"
  - "!**/.output/**"
  - "!**/.output-staff/**"
  - "!**/.vinxi/**"
  - "!**/test-results/**"
  - "!**/playwright-report/**"
  - "!**/coverage/**"
  - "!**/package-lock.json"
  - "!**/pnpm-lock.yaml"
  - "!**/bun.lock"
  - "!**/bun.lockb"
  - "!**/.tanstack/**"
  - "!**/.wrangler/**"
  - "!**/.idea/**"
  - "!**/.openidea/**"
  - "!**/.taste-skill/**"
  - "!**/.hallmark/**"
  - "!**/.impeccable/**"


  # Generic React / TypeScript / Tailwind / accessibility guidance only.
  # Repository-specific policy lives in AGENTS.md and is not duplicated here.
  path_instructions:
  - path: "src/**/*.{ts,tsx}"
    instructions: |
      Apply standard React 19 and TypeScript review rules:
      - Prefer function components and hooks; flag class components and
      legacy lifecycle patterns.
      - Preserve strict typing. Flag `any`, unchecked type assertions,
      and non-null assertions that hide a real null case; prefer
      narrowing or `unknown` with validation.
      - Flag state that duplicates props or query data when it can be
      derived, and effects that can be replaced by derived values.
      - Every async UI path needs loading, empty, and error states.
      - Check hook dependency arrays, cleanup of effects/subscriptions,
      and direct state mutation.
      - Reuse existing primitives from `src/components/ui` and shared
      helpers instead of adding one-off components or duplicated logic.
      - Accessibility: label form controls, keep interactive elements
      keyboard reachable, manage focus for dialogs/menus, and avoid
      click handlers on non-interactive elements without role/key
      handling.
      - Prefer an existing dependency over adding a new one for a small
      utility.
  - path: "src/routes/**/*.tsx"
    instructions: |
      TanStack Router conventions:
      - Routes are file-based. Do not edit `src/routeTree.gen.ts`; it is
      generated by the router plugin.
      - Validate params and search state with the router's schema
      validators instead of reading raw strings.
      - Prefer route loaders and TanStack Query for data loading over
      `useEffect` fetch waterfalls.
      - Use `Link`/`useNavigate` for internal navigation, not raw anchors.
      - Flag authorization or role checks that exist only in the client
      when the route also needs a server-side guard.
  - path: "src/components/ui/**/*.tsx"
    instructions: |
      These are shared UI primitives, so API changes ripple across the app:
      - Preserve forwarded refs, `className` merging via `cn`, and existing
      `data-slot`/ARIA attributes.
      - Extend behavior through `class-variance-authority` variants rather
      than forking the primitive.
      - Treat prop renames or removals as breaking changes and call them out.
  - path: "src/services/**"
    instructions: |
      Service-layer rules:
      - Keep HTTP calls centralized and typed; map external payloads to
      explicit models instead of passing raw JSON through the app.
      - Handle non-2xx responses and network failures explicitly.
      - Never log or embed tokens, credentials, or personal data.
      - Flag retries without backoff and requests that can race or leak
      stale responses into state.
  - path: "**/*.{test,spec}.{ts,tsx,mjs}"
    instructions: |
      Test rules:
      - Assert user-visible behavior rather than implementation details.
      - Flag arbitrary sleeps, shared mutable state, and order-dependent
      tests that will be flaky in CI.
      - Prefer deterministic fixtures over live network calls.
  - path: "**/*.css"
    instructions: |
      Tailwind CSS v4 rules:
      - Prefer design tokens and utilities over hard-coded hex colors and
      magic pixel values.
      - Keep light and dark themes working; flag colors that bypass theme
      variables.
      - Avoid `!important` and overly broad selectors when a scoped class
      or variant would do.

  auto_review:
    enabled: true
    # Review on open (when the PR is ready) and on each subsequent push.
    # Draft PRs are skipped until they are marked ready for review.
    drafts: false
    auto_incremental_review: true
    base_branches: []

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    resolve_merge_conflict:
      enabled: false
    fix_ci:
      enabled: false

chat:
  # Only reply when explicitly mentioned; avoids noise on ordinary PR comments.
  auto_reply: false
  art: true
  allow_non_org_members: false

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  # Generic path rules above are used instead of repo policy docs. Set this to
  # true if you also want AGENTS.md applied as review criteria.
  code_guidelines:
    enabled: false
  learnings:
    scope: "local"
  issues:
    scope: "local"
  pull_requests:
    scope: "local"
